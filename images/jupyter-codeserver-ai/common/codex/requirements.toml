# Codex enforced policy. Validated against Codex 0.150.1; see common/versions.env.
#
# Requirements are the ENFORCED tier. Values here cannot be weakened by a user's
# config.toml, profile files, or CLI overrides -- when a value conflicts, the
# client falls back to a compatible one and tells the user.
#
# Codex 0.137.0 and earlier IGNORE allowed_permission_profiles and managed
# default_permissions. A slip below the pinned version therefore removes these
# restrictions rather than degrading them, which is why the version floor in
# versions.env is load-bearing.

# Disable automatic update checks. The requester requires this, so it belongs in
# the enforced file rather than in managed_config.toml, where a user could
# override it until restart. This is the CLI control; features.in_app_updates is
# the ChatGPT desktop app's updater and is unrelated.
check_for_update_on_startup = false

# Managed hooks only: a user cannot introduce lifecycle hooks of their own.
allow_managed_hooks_only = true

# Approval policies. "never" is omitted, so it is denied.
allowed_approval_policies = ["untrusted", "on-request"]

# The default profile every session starts in.
#
# MEASURED 2026-08-28: this is ":danger-full-access" because it is the only
# profile that starts at all on this cluster, not because it is desirable.
# Codex sandboxes even its read of AGENTS.md, through a helper with two
# backends, and neither works inside this cluster's unprivileged Apptainer:
# its own bundled bwrap cannot pivot_root ("Can't bind mount /oldroot/ on
# /newroot/"), and the legacy Landlock backend cannot enforce restrictive
# profiles at all. Verified not to be caused by our launch flags -- a bare
# `apptainer exec <sif> codex` fails identically.
default_permissions = ":danger-full-access"

# The table is the COMPLETE allowlist. Anything omitted is denied, including
# built-ins added in future Codex versions -- so a future ":danger-something"
# cannot appear by default.
[allowed_permission_profiles]
# ONLY the working profile is allowed. ":read-only" and ":workspace" are
# omitted deliberately: both require the sandbox helper, so a student who
# selected one would get a bwrap crash rather than a restricted session. An
# unreachable broken option is worse than no option.
":danger-full-access" = true

# NO [permissions.filesystem] deny_read BLOCK -- and this absence is load-bearing.
#
# It used to deny the OTHER agent's credentials and the GitHub token:
#   ~/.ssh, ~/.config/gh, ~/.claude, ~/.aws, ~/.gnupg, ~/.netrc
#
# Declaring ANY read denial makes the runtime require an enforcing sandbox mode,
# which requires the helper, which cannot run here. Measured directly: with the
# denials present and ":danger-full-access" the only allowed profile, Codex
# refuses to start and says why --
#
#   invalid value for `sandbox_mode`: `DangerFullAccess` is not in the allowed
#   set [read-only, workspace-write] (set by /etc/codex/requirements.toml)
#
# -- where that allowed set is DERIVED FROM THE DENIALS THEMSELVES. So the list
# and a working Codex are mutually exclusive on this cluster. Restoring it
# without first fixing the sandbox makes Codex unusable for every student, which
# is why tests/test-recipe.sh asserts it stays absent.
#
# What this costs is NARROWER than the profile name suggests. Measured in a live
# session, /status reports:
#
#   Permissions:  No Sandbox (Ask for approval)
#
# The filesystem sandbox is gone; approval prompting SURVIVES, because
# allowed_approval_policies above still governs it. Codex still asks before it
# runs anything. So what this costs, precisely: Codex no longer enforces its own
# filesystem restrictions. The container mount boundary is untouched and was always the
# real boundary -- agent policy here has always been defence in depth -- and
# ~/.ssh remains masked by the launcher's bind regardless. What is lost is an
# additional mitigation over an exposure the design already accepts under
# "Accepted home-directory exposure".
#
# TO RESTORE: fix the sandbox at the Apptainer level (the failure is bwrap
# unable to bind /oldroot over /newroot, which points at mount propagation),
# then set default_permissions back to ":workspace", re-allow the restrictive
# profiles, and reinstate the block above. Claude Code is very likely failing
# the same way today and degrading silently behind failIfUnavailable: false, so
# the same fix would restore both.

[features]
plugins = false

# An explicit empty allowlist disables unapproved MCP servers. Present and empty
# is a policy; absent would be unconstrained.
[mcp_servers]
